    <text x="90" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#FFF">满血出发</text>
    <text x="90" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">Dock 图标</text>
    <rect x="65" y="238" width="50" height="50" rx="10" fill="#C4956A"/>
    <ellipse cx="90" cy="258" rx="10" ry="9" fill="#D4B898"/>
    <circle cx="85" cy="254" r="2.5" fill="#3A4A5C"/><circle cx="95" cy="254" r="2.5" fill="#3A4A5C"/>
    <text x="90" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">配色</text>
    <rect x="30" y="318" width="16" height="16" rx="4" fill="#C4956A"/>
    <rect x="52" y="318" width="16" height="16" rx="4" fill="#A87D58"/>
    <rect x="74" y="318" width="16" height="16" rx="4" fill="#D4B898"/>
    <rect x="96" y="318" width="16" height="16" rx="4" fill="#5C4030"/>
  </g>
  <!-- Theme 3: 奶咖 -->
  <g transform="translate(430,55)">
    <rect x="0" y="0" width="180" height="340" rx="14" fill="#FBFAF7" filter="url(#c3card)"/>
    <text x="90" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#A89880">奶咖</text>
    <g transform="translate(90,110)">
