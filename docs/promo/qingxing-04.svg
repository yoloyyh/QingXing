<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <defs>
    <linearGradient id="c4bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F5F7FA"/></linearGradient>
    <linearGradient id="c4green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#66BB6A"/><stop offset="100%" stop-color="#388E3C"/></linearGradient>
    <filter id="c4shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity="0.08"/></filter>
    <filter id="c4card"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.05"/></filter>
  </defs>
  <rect width="640" height="420" rx="20" fill="url(#c4bg)" filter="url(#c4shadow)"/>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3A4A5C">轻醒 · QingXing</text>
  <!-- Central: Shield / Lock icon -->
  <g transform="translate(320,100)">
    <circle cx="0" cy="0" r="48" fill="#E8F5E9"/>
    <rect x="-18" y="-20" width="36" height="40" rx="6" fill="#4CAF50"/>
    <rect x="-12" y="-4" width="24" height="18" rx="3" fill="#E8F5E9"/>
    <circle cx="0" cy="5" r="3" fill="#4CAF50"/>
    <rect x="-1.5" y="8" width="3" height="8" rx="1.5" fill="#4CAF50"/>
    <path d="M-18 -12 C-18 -28,18 -28,18 -12" fill="#388E3C"/>
  </g>
  <!-- Title -->
  <text x="320" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#2E7D32">画面留在你的电脑里</text>
  <text x="320" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#7B8EA0">不录制 · 不保存 · 不上传</text>
  <!-- Three feature cards -->
  <!-- Card 1: 5 seconds -->
  <g transform="translate(30,225)">
    <rect x="0" y="0" width="180" height="90" rx="12" fill="#F0F4FA" filter="url(#c4card)"/>
    <text x="90" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#7B9EC7">5</text>
    <text x="90" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3A4A5C">秒内完成检测</text>
    <text x="90" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">每轮最多 5 秒</text>
    <text x="90" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">检测完立即释放摄像头</text>
  </g>
  <!-- Card 2: Periodic -->
  <g transform="translate(230,225)">
    <rect x="0" y="0" width="180" height="90" rx="12" fill="#F0F4FA" filter="url(#c4card)"/>
    <text x="90" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#7B9EC7">30</text>
    <text x="90" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3A4A5C">分钟间隔采样</text>
    <text x="90" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">不持续监测</text>
    <text x="90" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">偏近时 5 分钟复查</text>
  </g>
  <!-- Card 3: Local -->
  <g transform="translate(430,225)">
    <rect x="0" y="0" width="180" height="90" rx="12" fill="#F0F4FA" filter="url(#c4card)"/>
    <text x="90" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#7B9EC7">💻</text>
    <text x="90" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3A4A5C">仅本机处理</text>
    <text x="90" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">画面在内存中分析</text>
    <text x="90" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">无网络上传</text>
  </g>
  <!-- Bottom permission badges -->
  <g transform="translate(60,338)">
    <text x="0" y="12" font-family="system-ui,sans-serif" font-size="11" fill="#7B8EA0">权限说明：</text>
    <rect x="100" y="0" width="100" height="20" rx="8" fill="#E8F5E9"/>
    <text x="150" y="14" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#2E7D32">✓ 摄像头（需授权）</text>
    <rect x="215" y="0" width="100" height="20" rx="8" fill="#E8F5E9"/>
    <text x="265" y="14" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#2E7D32">✓ 登录时启动（可选）</text>
    <rect x="330" y="0" width="130" height="20" rx="8" fill="#FFF3E0"/>
    <text x="395" y="14" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#E65100">✗ 无需麦克风/屏幕录制</text>
    <rect x="60" y="32" width="120" height="20" rx="8" fill="#FFF3E0"/>
    <text x="120" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#E65100">✗ 不读取其他应用</text>
    <rect x="195" y="32" width="100" height="20" rx="8" fill="#FFF3E0"/>
    <text x="245" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#E65100">✗ 不录制画面</text>
  </g>
</svg>