<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <defs>
    <linearGradient id="c2bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F5F7FA"/></linearGradient>
    <linearGradient id="c2ringFull" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#66BB6A"/><stop offset="100%" stop-color="#2E7D32"/></linearGradient>
    <filter id="c2shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity="0.08"/></filter>
    <filter id="c2card"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="640" height="420" rx="20" fill="url(#c2bg)" filter="url(#c2shadow)"/>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3A4A5C">轻醒 · QingXing</text>
  <!-- Three stages -->
  <!-- Stage 1: 等待休息 -->
  <g transform="translate(70,140)">
    <circle cx="0" cy="0" r="52" stroke="#E8EDF2" stroke-width="8" fill="none"/>
    <path d="M0 -52 A52 52 0 0 1 52 0" stroke="#FF9800" stroke-width="8" fill="none" stroke-linecap="round"/>
    <text x="0" y="-35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">该充电</text>
    <!-- mini owl -->
    <circle cx="-10" cy="2" r="7" fill="#3A4A5C"/><circle cx="-10" cy="2" r="2.5" fill="#FFF"/>
    <circle cx="10" cy="2" r="7" fill="#3A4A5C"/><circle cx="10" cy="2" r="2.5" fill="#FFF"/>
    <path d="M-3 8 L3 8 L0 12 Z" fill="#FF9800"/>
  </g>
  <text x="70" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">工作 45 分钟</text>
  <text x="70" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">该休息了</text>
  <!-- Arrow -->
  <path d="M130 140 L180 140" stroke="#C0CCD8" stroke-width="2" marker-end="url(#c2arrow)"/>
  <!-- Stage 2: 充能中 -->
  <g transform="translate(245,140)">
    <circle cx="0" cy="0" r="52" stroke="#E8EDF2" stroke-width="8" fill="none"/>
    <circle cx="0" cy="0" r="52" stroke="#7B9EC7" stroke-width="8" fill="none" stroke-dasharray="163 327" stroke-dashoffset="0" transform="rotate(-90)" stroke-linecap="round"/>
    <text x="0" y="-35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">充能中</text>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#5A7DA8">50%</text>
  </g>
  <!-- Arrow -->
  <path d="M305 140 L355 140" stroke="#C0CCD8" stroke-width="2" marker-end="url(#c2arrow)"/>
  <!-- Stage 3: 满血 -->
  <g transform="translate(420,140)">
    <circle cx="0" cy="0" r="52" stroke="url(#c2ringFull)" stroke-width="8" fill="none"/>
    <text x="0" y="-35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#388E3C">满血 ✦</text>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#2E7D32">100%</text>
  </g>
  <text x="420" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">休息完成</text>
  <text x="420" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">满血状态</text>
  <!-- Divider -->
  <line x1="30" y1="260" x2="610" y2="260" stroke="#E8EDF2" stroke-width="1"/>
  <!-- Award card -->
  <g transform="translate(120,280)">
    <rect x="0" y="0" width="400" height="110" rx="16" fill="#E8F5E9" filter="url(#c2card)"/>
    <!-- Big +1 -->
    <text x="140" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="56" font-weight="800" fill="#4CAF50">+1</text>
    <!-- Checkmark circle -->
    <circle cx="140" cy="60" r="48" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="6,4" opacity="0.3"/>
    <!-- Label -->
    <text x="140" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#2E7D32">调整成功</text>
    <!-- Right side: today count -->
    <text x="280" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7B8EA0">今日累计</text>
    <text x="280" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="40" font-weight="700" fill="#7B9EC7">8</text>
    <text x="280" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7B8EA0">次调整</text>
    <!-- Sparkle -->
    <text x="210" y="45" font-family="system-ui,sans-serif" font-size="20" fill="#FFC107">✦</text>
    <text x="80" y="70" font-family="system-ui,sans-serif" font-size="14" fill="#FFC107">✦</text>
  </g>
  <defs>
    <marker id="c2arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0CCD8"/></marker>
  </defs>
</svg>