<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F5F7FA"/></linearGradient>
    <linearGradient id="ringFull" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#66BB6A"/><stop offset="100%" stop-color="#2E7D32"/></linearGradient>
    <linearGradient id="ringBlueGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7B9EC7"/><stop offset="100%" stop-color="#5A7DA8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity="0.08"/></filter>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="640" height="420" rx="20" fill="url(#cardBg)" filter="url(#shadow)"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="640" height="48" fill="#F8FAFD" rx="20"/>
  <rect x="0" y="24" width="640" height="24" fill="#F8FAFD"/>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3A4A5C">轻醒 · QingXing</text>
  <!-- Main content area -->
  <!-- Owl with health ring (center) -->
  <g transform="translate(200,180)">
    <!-- Health ring background -->
    <circle cx="0" cy="0" r="78" stroke="#E8EDF2" stroke-width="10" fill="none"/>
    <!-- Health ring full -->
    <circle cx="0" cy="0" r="78" stroke="url(#ringFull)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Star decorations -->
    <text x="68" y="-52" font-family="system-ui,sans-serif" font-size="16" fill="#FFC107">✦</text>
    <text x="-72" y="-40" font-family="system-ui,sans-serif" font-size="12" fill="#FFC107">✦</text>
    <text x="55" y="68" font-family="system-ui,sans-serif" font-size="14" fill="#FFC107">✦</text>
    <!-- Owl body -->
    <ellipse cx="0" cy="8" rx="40" ry="36" fill="#7B9EC7"/>
    <!-- Owl belly -->
    <ellipse cx="0" cy="14" rx="24" ry="20" fill="#A8C4E0"/>
    <!-- Ear tufts -->
    <path d="M-28 -30 L-36 -52 L-14 -32 Z" fill="#5A7DA8"/>
    <path d="M28 -30 L36 -52 L14 -32 Z" fill="#5A7DA8"/>
    <!-- Eyes -->
    <circle cx="-16" cy="-2" r="14" fill="#FFF"/>
    <circle cx="16" cy="-2" r="14" fill="#FFF"/>
    <circle cx="-14" cy="-2" r="8" fill="#3A4A5C"/>
    <circle cx="14" cy="-2" r="8" fill="#3A4A5C"/>
    <circle cx="-12" cy="-4" r="3" fill="#FFF"/>
    <circle cx="12" cy="-4" r="3" fill="#FFF"/>
    <!-- Beak -->
    <path d="M-5 6 L5 6 L0 12 Z" fill="#FFB74D"/>
    <!-- Happy blush -->
    <ellipse cx="-28" cy="6" rx="8" ry="4" fill="#E8A0BF" opacity="0.4"/>
    <ellipse cx="28" cy="6" rx="8" ry="4" fill="#E8A0BF" opacity="0.4"/>
    <!-- Wings -->
    <ellipse cx="-36" cy="8" rx="8" ry="16" fill="#5A7DA8" transform="rotate(15,-36,8)"/>
    <ellipse cx="36" cy="8" rx="8" ry="16" fill="#5A7DA8" transform="rotate(-15,36,8)"/>
    <!-- Feet -->
    <ellipse cx="-12" cy="46" rx="8" ry="4" fill="#FFB74D"/>
    <ellipse cx="12" cy="46" rx="8" ry="4" fill="#FFB74D"/>
  </g>
  <!-- Status label -->
  <rect x="180" y="278" width="80" height="24" rx="12" fill="#E8F5E9"/>
  <text x="220" y="294" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#2E7D32">满血状态</text>
  <!-- Stats cards (right side) -->
  <!-- Today adjustments -->
  <g transform="translate(340,140)">
    <rect x="0" y="0" width="120" height="64" rx="12" fill="#F0F4FA" filter="url(#cardShadow)"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7B8EA0">今日调整</text>
    <text x="60" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#4CAF50">8</text>
  </g>
  <!-- Today fills -->
  <g transform="translate(340,216)">
    <rect x="0" y="0" width="120" height="64" rx="12" fill="#F0F4FA" filter="url(#cardShadow)"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7B8EA0">充满次数</text>
    <text x="60" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#7B9EC7">5</text>
  </g>
  <!-- Reminder card (bottom left) -->
  <g transform="translate(40,310)">
    <rect x="0" y="0" width="140" height="56" rx="10" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1.5"/>
    <text x="12" y="20" font-family="system-ui,sans-serif" font-size="11" fill="#E65100">⚠️ 距离偏近</text>
    <text x="12" y="38" font-family="system-ui,sans-serif" font-size="11" fill="#7B8EA0">比参考位置近约 6 cm</text>
  </g>
  <!-- Head down reminder -->
  <g transform="translate(200,310)">
    <rect x="0" y="0" width="120" height="56" rx="10" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5"/>
    <text x="12" y="20" font-family="system-ui,sans-serif" font-size="11" fill="#1976D2">🔍 低头提醒</text>
    <text x="12" y="38" font-family="system-ui,sans-serif" font-size="11" fill="#7B8EA0">轻轻抬起头吧</text>
  </g>
  <!-- 满血出发 button -->
  <g transform="translate(486,310)">
    <rect x="0" y="0" width="110" height="56" rx="12" fill="#7B9EC7"/>
    <text x="55" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FFF">满血出发</text>
  </g>
</svg>