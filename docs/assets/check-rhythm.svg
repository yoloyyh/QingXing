<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F8FAFD"/><stop offset="100%" stop-color="#EEF2F7"/></linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7B9EC7"/><stop offset="100%" stop-color="#5A7DA8"/></linearGradient>
  </defs>
  <rect width="720" height="180" rx="14" fill="url(#bg)"/>
  <!-- Timeline axis -->
  <line x1="40" y1="140" x2="680" y2="140" stroke="#D0D8E4" stroke-width="2" stroke-linecap="round"/>
  <!-- Node 1: 等待 30 分钟 -->
  <circle cx="80" cy="140" r="12" fill="url(#blueGrad)"/>
  <text x="80" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3A4A5C">等待</text>
  <text x="80" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">30 分钟</text>
  <!-- Arrow 1 -->
  <path d="M95 140 L175 140" stroke="#7B9EC7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Node 2: 检测 5 秒 -->
  <circle cx="210" cy="140" r="12" fill="#FF9800"/>
  <text x="210" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#E65100">检测</text>
  <text x="210" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">最多 5 秒</text>
  <text x="210" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">摄像头开启</text>
  <!-- Arrow 2: split -->
  <path d="M225 140 L305 140" stroke="#4CAF50" stroke-width="2"/>
  <text x="265" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4CAF50">姿势正常</text>
  <!-- Node 3: 回到等待 -->
  <circle cx="340" cy="140" r="12" fill="url(#blueGrad)"/>
  <text x="340" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">继续等待</text>
  <!-- Arrow 3: back to wait -->
  <path d="M355 140 C430 140,430 100,340 100 C260 100,260 155,80 155" stroke="#7B9EC7" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <text x="380" y="96" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">恢复后回到 30 分钟</text>
  <!-- Node 4: 偏近复查 -->
  <path d="M225 155 C225 200,300 200,300 155" stroke="#FF5722" stroke-width="2" fill="none"/>
  <circle cx="300" cy="185" r="12" fill="#FF5722"/>
  <text x="300" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#BF360C">每 5 分钟复查</text>
  <text x="225" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7B8EA0">确认偏近</text>
  <!-- Arrow 5: still close -->
  <path d="M315 185 L400 185" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="435" cy="185" r="12" fill="#D32F2F"/>
  <text x="435" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B71C1C">增强提醒</text>
  <!-- Arrow 6: adjusted -->
  <path d="M315 175 L400 140" stroke="#4CAF50" stroke-width="2"/>
  <text x="358" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4CAF50">已调整 ✓</text>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7B9EC7"/></marker>
  </defs>
</svg>