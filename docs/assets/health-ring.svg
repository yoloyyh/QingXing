<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F8FAFD"/><stop offset="100%" stop-color="#EEF2F7"/></linearGradient>
    <linearGradient id="ringBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7B9EC7"/><stop offset="100%" stop-color="#5A7DA8"/></linearGradient>
    <linearGradient id="ringGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#66BB6A"/><stop offset="100%" stop-color="#388E3C"/></linearGradient>
  </defs>
  <rect width="720" height="280" rx="14" fill="url(#bg2)"/>
  <!-- Stage 1: 工作后该充电 -->
  <g transform="translate(120,140)">
    <circle cx="0" cy="0" r="55" stroke="#E8EDF2" stroke-width="10" fill="none"/>
    <path d="M0 -55 A55 55 0 0 1 55 0" stroke="#FF9800" stroke-width="10" fill="none" stroke-linecap="round"/>
    <text x="0" y="-40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7B8EA0">该充电</text>
    <!-- owl face -->
    <circle cx="-14" cy="-5" r="8" fill="#3A4A5C"/><circle cx="-14" cy="-5" r="3" fill="#FFF"/>
    <circle cx="14" cy="-5" r="8" fill="#3A4A5C"/><circle cx="14" cy="-5" r="3" fill="#FFF"/>
    <path d="M-4 3 L4 3 L0 8 Z" fill="#FF9800"/>
  </g>
  <text x="120" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#3A4A5C">工作结束</text>
  <text x="120" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">健康环消耗 → 需要休息</text>
  <!-- Arrow -->
  <path d="M180 140 L250 140" stroke="#C0CCD8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Stage 2: 休息充能 50% -->
  <g transform="translate(360,140)">
    <circle cx="0" cy="0" r="55" stroke="#E8EDF2" stroke-width="10" fill="none"/>
    <circle cx="0" cy="0" r="55" stroke="url(#ringBlue)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="173 345" stroke-dashoffset="0" transform="rotate(-90)"/>
    <text x="0" y="-40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7B8EA0">充能中</text>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#5A7DA8">50%</text>
  </g>
  <!-- Arrow -->
  <path d="M420 140 L490 140" stroke="#C0CCD8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Stage 3: 满血 -->
  <g transform="translate(600,140)">
    <circle cx="0" cy="0" r="55" stroke="url(#ringGreen)" stroke-width="10" fill="none"/>
    <text x="0" y="-40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#388E3C">满血</text>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#2E7D32">100%</text>
    <!-- star -->
    <text x="40" y="-35" font-family="system-ui,sans-serif" font-size="18" fill="#FFC107">✦</text>
    <text x="-45" y="-30" font-family="system-ui,sans-serif" font-size="14" fill="#FFC107">✦</text>
  </g>
  <text x="600" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#3A4A5C">满血状态</text>
  <text x="600" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#7B8EA0">休息完成 · 准备出发</text>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0CCD8"/></marker>
  </defs>
</svg>