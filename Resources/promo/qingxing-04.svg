<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 766" width="1100" height="766" role="img" aria-labelledby="title desc">
<title id="title">轻醒检测节奏与本机处理说明</title>
<desc id="desc">轻醒宣传素材。App 界面来自现有 SwiftUI 视图的本机渲染，展示示例状态。画面不包含摄像头照片。</desc>
<defs><filter id="shadow" x="-20%" y="-15%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B3D57" flood-opacity=".08"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#406B94"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="0" y="0" width="1100" height="766" rx="28" fill="#F5F7F7" />
<text x="64" y="48" font-size="18" fill="#406B94" font-weight="600" text-anchor="start">轻醒 · QingXing / 04</text><text x="64" y="104" font-size="40" fill="#2B3D57" font-weight="600" text-anchor="start">看一眼就好，画面留在本机。</text><text x="64" y="141" font-size="19" fill="#68747F" font-weight="400" text-anchor="start">摄像头按轮次开启，检测结束后关闭并释放。</text><rect x="64" y="179" width="972" height="73" rx="18" fill="white" /><text x="94" y="225" font-size="27" fill="#406B94" font-weight="600" text-anchor="start">不录制 · 不保存 · 不上传摄像头画面</text><rect x="64" y="282" width="296" height="244" rx="22" fill="white" /><text x="88" y="345" font-size="37" fill="#406B94" font-weight="600" text-anchor="start">5 秒</text><text x="88" y="389" font-size="22" fill="#2B3D57" font-weight="600" text-anchor="start">每轮检测上限</text><text x="88" y="450" font-size="17" fill="#68747F" font-weight="400" text-anchor="start">结束后关闭摄像头</text><text x="88" y="481" font-size="17" fill="#68747F" font-weight="400" text-anchor="start">没看清时会说明无法判断</text><rect x="402" y="282" width="296" height="244" rx="22" fill="white" /><text x="426" y="345" font-size="37" fill="#406B94" font-weight="600" text-anchor="start">30 分钟</text><text x="426" y="389" font-size="22" fill="#2B3D57" font-weight="600" text-anchor="start">平时的检测间隔</text><text x="426" y="450" font-size="17" fill="#68747F" font-weight="400" text-anchor="start">确认偏近后每 5 分钟复查</text><text x="426" y="481" font-size="17" fill="#68747F" font-weight="400" text-anchor="start">确认恢复后回到半小时</text><rect x="740" y="282" width="296" height="244" rx="22" fill="white" /><text x="764" y="345" font-size="37" fill="#406B94" font-weight="600" text-anchor="start">本机</text><text x="764" y="389" font-size="22" fill="#2B3D57" font-weight="600" text-anchor="start">画面在内存中分析</text><text x="764" y="450" font-size="17" fill="#68747F" font-weight="400" text-anchor="start">保存设置、校准与数字记录</text><text x="764" y="481" font-size="17" fill="#68747F" font-weight="400" text-anchor="start">摄像头画面不写入磁盘</text><text x="64" y="585" font-size="25" fill="#2B3D57" font-weight="600" text-anchor="start">只在你授权后使用摄像头</text><text x="64" y="624" font-size="20" fill="#68747F" font-weight="400" text-anchor="start">无需麦克风、屏幕录制、文件或键鼠权限，也不读取其他应用。</text><text x="64" y="672" font-size="20" fill="#406B94" font-weight="400" text-anchor="start">不使用摄像头，也可以单独开启工作与休息计时。</text><text x="64" y="733" font-size="14" fill="#68747F" font-weight="400" text-anchor="start">轻醒 · macOS 14+ · 原生 SwiftUI · 按你的节奏来</text></g></svg>