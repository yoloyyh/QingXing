<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 444" width="1100" height="444" role="img" aria-labelledby="title desc">
<title id="title">轻醒间隔检测与距离复查流程</title>
<desc id="desc">轻醒宣传素材。App 界面来自现有 SwiftUI 视图的本机渲染，展示示例状态。画面不包含摄像头照片。</desc>
<defs><filter id="shadow" x="-20%" y="-15%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B3D57" flood-opacity=".08"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#406B94"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="0" y="0" width="1100" height="444" rx="28" fill="#F5F7F7" />
<text x="54" y="49" font-size="28" fill="#2B3D57" font-weight="600" text-anchor="start">看一眼就好，摄像头不用一直开。</text><rect x="54" y="90" width="240" height="100" rx="18" fill="white" /><text x="74" y="129" font-size="22" fill="#406B94" font-weight="600" text-anchor="start">等待 30 分钟</text><text x="74" y="165" font-size="16" fill="#68747F" font-weight="400" text-anchor="start">摄像头关闭</text><rect x="430" y="90" width="240" height="100" rx="18" fill="white" /><text x="450" y="129" font-size="22" fill="#406B94" font-weight="600" text-anchor="start">检测最多 5 秒</text><text x="450" y="165" font-size="16" fill="#68747F" font-weight="400" text-anchor="start">仅本轮开启摄像头</text><rect x="806" y="90" width="240" height="100" rx="18" fill="white" /><text x="826" y="129" font-size="22" fill="#406B94" font-weight="600" text-anchor="start">结束并关闭</text><text x="826" y="165" font-size="16" fill="#68747F" font-weight="400" text-anchor="start">按本轮结果安排下次检测</text><path d="M305 140 H417" fill="none" stroke="#406B94" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M681 140 H793" fill="none" stroke="#406B94" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M926 191 V220 H292 V254" fill="none" stroke="#406B94" stroke-opacity=".55" stroke-width="2" marker-end="url(#arrow)"/><path d="M926 191 V220 H780 V254" fill="none" stroke="#406B94" stroke-opacity=".55" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="265" width="475" height="105" rx="18" fill="#E7EEF3" /><text x="78" y="306" font-size="22" fill="#406B94" font-weight="600" text-anchor="start">结果正常 / 已确认恢复</text><text x="78" y="342" font-size="18" fill="#68747F" font-weight="400" text-anchor="start">回到每 30 分钟检测一次</text><rect x="571" y="265" width="475" height="105" rx="18" fill="#F3EBE1" /><text x="595" y="306" font-size="22" fill="#A46C33" font-weight="600" text-anchor="start">确认偏近 → 每 5 分钟复查</text><text x="595" y="342" font-size="17" fill="#68747F" font-weight="400" text-anchor="start">持续偏近时增强提醒，恢复后回到半小时</text><text x="64" y="413" font-size="14" fill="#68747F" font-weight="400" text-anchor="start">间隔采样：摄像头关闭期间不会即时感知姿势变化；也可以手动立即检测。</text></g></svg>